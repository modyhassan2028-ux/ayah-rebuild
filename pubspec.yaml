name: ayah_rebuild
description: نسخة مبنية من تطبيق Ayah بأصوله وبياناته الأصلية
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.3
  just_audio: ^0.9.42
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  sqflite: ^2.4.1
  path: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4
  test: ^1.25.8
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/ic_launcher.png
    - assets/quran-images/
  fonts:
    - family: HafsSmart
      fonts:
        - asset: assets/fonts/hafs_smart_08.ttf
    - family: QuranTitles
      fonts:
        - asset: assets/fonts/quran_titles.ttf
    - family: QuranNumbers
      fonts:
        - asset: assets/fonts/quran_numbers.ttf
